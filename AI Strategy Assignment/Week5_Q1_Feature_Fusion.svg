<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" role="img" aria-labelledby="fusion-title fusion-desc" style="font-family:Arial,Helvetica,sans-serif">
<title id="fusion-title">Two architectures for text and structured features</title>
<desc id="fusion-desc">A: normalize a 768-dimensional text embedding and transform two numeric features, concatenate to 770, then train a 64-unit MLP and sigmoid. B: project text to 64 dimensions and numeric features to 16, concatenate to 80, then train an 80-to-32-to-1 fusion head and sigmoid. Both use training-set preprocessing and fraud labels.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b8598"/></marker></defs>
<rect width="1120" height="730" rx="16" fill="#ffffff"/>
<rect x="18" y="18" width="1084" height="312" rx="16" fill="#f8fafc" stroke="#dce5ec"/><circle cx="52" cy="52" r="17" fill="#18384d"/><text x="52" y="58" text-anchor="middle" fill="white" font-size="17" font-weight="700">A</text><text x="82" y="50" fill="#18384d" font-size="20" font-weight="700">Early concatenation</text><text x="82" y="73" fill="#526c7d" font-size="14">Baseline: combine features before the learned classifier</text><rect x="42" y="106" width="172" height="78" rx="12" fill="#edf4ff" stroke="#b8cff3"/><text x="128.0" y="141.0" text-anchor="middle" fill="#2459a5" font-size="16" font-weight="700">Text embedding</text><text x="128.0" y="165.0" text-anchor="middle" fill="#2459a5" font-size="14">768 dimensions</text><rect x="42" y="228" width="172" height="78" rx="12" fill="#fff4e9" stroke="#edc99e"/><text x="128.0" y="263.0" text-anchor="middle" fill="#914d16" font-size="16" font-weight="700">Amount + age</text><text x="128.0" y="287.0" text-anchor="middle" fill="#914d16" font-size="14">2 numeric features</text><rect x="248" y="106" width="210" height="78" rx="12" fill="#edf4ff" stroke="#b8cff3"/><text x="353.0" y="141.0" text-anchor="middle" fill="#2459a5" font-size="16" font-weight="700">Normalize text</text><text x="353.0" y="165.0" text-anchor="middle" fill="#2459a5" font-size="14">LayerNorm</text><rect x="248" y="228" width="210" height="78" rx="12" fill="#fff4e9" stroke="#edc99e"/><text x="353.0" y="263.0" text-anchor="middle" fill="#914d16" font-size="16" font-weight="700">Transform numbers</text><text x="353.0" y="287.0" text-anchor="middle" fill="#914d16" font-size="14">log1p + train-set scaling</text><rect x="508" y="166" width="146" height="82" rx="12" fill="#e9f6f3" stroke="#a4d5c9"/><text x="581.0" y="203.0" text-anchor="middle" fill="#126456" font-size="16" font-weight="700">Concatenate</text><text x="581.0" y="227.0" text-anchor="middle" fill="#126456" font-size="14">770 = 768 + 2</text><rect x="694" y="166" width="172" height="82" rx="12" fill="#ffffff" stroke="#cdd8e1"/><text x="780.0" y="203.0" text-anchor="middle" fill="#213c51" font-size="16" font-weight="700">Learned MLP</text><text x="780.0" y="227.0" text-anchor="middle" fill="#213c51" font-size="14">770 → 64 → ReLU → 1</text><rect x="906" y="166" width="172" height="82" rx="12" fill="#18384d" stroke="#18384d"/><text x="992.0" y="192.5" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Fraud probability</text><text x="992.0" y="216.5" text-anchor="middle" fill="#ffffff" font-size="14">1 logit → sigmoid</text><text x="992.0" y="237.5" text-anchor="middle" fill="#ffffff" font-size="14">P(fraud | inputs)</text><path d="M214 145 H248" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M214 267 H248" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M458 145 H482 V191 H508" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M458 267 H482 V224 H508" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M654 207 H694" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M866 207 H906" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="18" y="350" width="1084" height="312" rx="16" fill="#f8fafc" stroke="#dce5ec"/><circle cx="52" cy="384" r="17" fill="#18384d"/><text x="52" y="390" text-anchor="middle" fill="white" font-size="17" font-weight="700">B</text><text x="82" y="382" fill="#18384d" font-size="20" font-weight="700">Separate branches, then fusion</text><text x="82" y="405" fill="#526c7d" font-size="14">Recommended candidate: learn a representation for each input type</text><rect x="42" y="438" width="172" height="78" rx="12" fill="#edf4ff" stroke="#b8cff3"/><text x="128.0" y="473.0" text-anchor="middle" fill="#2459a5" font-size="16" font-weight="700">Text embedding</text><text x="128.0" y="497.0" text-anchor="middle" fill="#2459a5" font-size="14">768 dimensions</text><rect x="42" y="560" width="172" height="78" rx="12" fill="#fff4e9" stroke="#edc99e"/><text x="128.0" y="595.0" text-anchor="middle" fill="#914d16" font-size="16" font-weight="700">Amount + age</text><text x="128.0" y="619.0" text-anchor="middle" fill="#914d16" font-size="14">2 numeric features</text><rect x="248" y="438" width="210" height="78" rx="12" fill="#edf4ff" stroke="#b8cff3"/><text x="353.0" y="473.0" text-anchor="middle" fill="#2459a5" font-size="16" font-weight="700">Text branch → 64</text><text x="353.0" y="497.0" text-anchor="middle" fill="#2459a5" font-size="14">LayerNorm → Linear → ReLU</text><rect x="248" y="560" width="210" height="78" rx="12" fill="#fff4e9" stroke="#edc99e"/><text x="353.0" y="584.5" text-anchor="middle" fill="#914d16" font-size="16" font-weight="700">Numeric branch → 16</text><text x="353.0" y="608.5" text-anchor="middle" fill="#914d16" font-size="14">log1p + train-set scaling</text><text x="353.0" y="629.5" text-anchor="middle" fill="#914d16" font-size="14">Linear → ReLU</text><rect x="508" y="498" width="146" height="82" rx="12" fill="#e9f6f3" stroke="#a4d5c9"/><text x="581.0" y="535.0" text-anchor="middle" fill="#126456" font-size="16" font-weight="700">Concatenate</text><text x="581.0" y="559.0" text-anchor="middle" fill="#126456" font-size="14">80 = 64 + 16</text><rect x="694" y="498" width="172" height="82" rx="12" fill="#ffffff" stroke="#cdd8e1"/><text x="780.0" y="535.0" text-anchor="middle" fill="#213c51" font-size="16" font-weight="700">Learned MLP</text><text x="780.0" y="559.0" text-anchor="middle" fill="#213c51" font-size="14">80 → 32 → ReLU → 1</text><rect x="906" y="498" width="172" height="82" rx="12" fill="#18384d" stroke="#18384d"/><text x="992.0" y="524.5" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Fraud probability</text><text x="992.0" y="548.5" text-anchor="middle" fill="#ffffff" font-size="14">1 logit → sigmoid</text><text x="992.0" y="569.5" text-anchor="middle" fill="#ffffff" font-size="14">P(fraud | inputs)</text><path d="M214 477 H248" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M214 599 H248" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M458 477 H482 V523 H508" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M458 599 H482 V556 H508" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M654 539 H694" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M866 539 H906" fill="none" stroke="#6b8598" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="34" y="696" fill="#526c7d" font-size="15">Training: fraud labels + binary cross-entropy on logits. Apply sigmoid at inference.</text><text x="34" y="720" fill="#526c7d" font-size="15">Fit preprocessing on training data only. More dimensions do not automatically mean more influence.</text></svg>